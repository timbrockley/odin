version: "3"

vars:
  CACHE_PATH: ".odin-cache"
  OUTPUT_PATH: "odin-out"

tasks:
  clean:
    cmds:
      - rm -rf {{.CACHE_PATH}} {{.OUTPUT_PATH}}

  build:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - odin build ../main.odin -file -out:main -o:speed

  debug:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - odin build ../main.odin -file -out:main -debug

  run:
    dir: "{{.OUTPUT_PATH}}"
    cmd: ./main

  test:
    dir: "{{.OUTPUT_PATH}}"
    cmd: ./main
