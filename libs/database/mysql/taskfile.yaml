version: "3"

vars:
  CACHE_PATH: ".odin-cache"
  OUTPUT_PATH: "odin-out"

tasks:
  clean:
    cmds:
      - rm -rf {{.CACHE_PATH}} {{.OUTPUT_PATH}}

  build:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - mkdir -p libs
      - test -s libs/unittest || ln -s ../../../../unittest/ libs/
      - cp ../database-mysql.odin .
      - cp ../main-mysql.odin .
      # - odin build . -out:main-mysql -o:speed

  debug:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - mkdir -p libs
      - test -s libs/unittest || ln -s ../../../../unittest/ libs/
      - cp ../database-mysql.odin .
      - cp ../main-mysql.odin .
      - odin build . -out:main-mysql -debug

  run:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - mkdir -p libs
      - test -s libs/unittest || ln -s ../../../../unittest/ libs/
      - cp ../database-mysql.odin .
      - cp ../main-mysql.odin .
      - odin run .

  test:
    dir: "{{.OUTPUT_PATH}}"
    cmds:
      - cp ../database-mysql.odin .
      - cp ../database-mysql_tests.odin .
      - odin test .

